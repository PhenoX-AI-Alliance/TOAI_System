<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TOAI Internal Report | The Enforcer / Manager</title>
    <style>
        
:root { --neon-blue: #00f2ff; --bg: #0a0b10; --card-bg: rgba(20, 25, 40, 0.7); --border: rgba(0, 242, 255, 0.3); }
body { background: var(--bg); color: #e0e6ed; font-family: 'Inter', sans-serif; margin: 0; padding: 40px; }
h1 { color: var(--neon-blue); text-transform: uppercase; letter-spacing: 4px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; margin-top: 40px; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; backdrop-filter: blur(10px); transition: transform 0.3s, border-color 0.3s; text-decoration: none; color: inherit; display: block; }
.card:hover { transform: translateY(-5px); border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
.unit-id { font-size: 0.8em; color: var(--neon-blue); font-weight: bold; margin-bottom: 8px; }
.unit-name { font-size: 1.4em; font-weight: bold; margin-bottom: 16px; display: block; }
.status { display: flex; align-items: center; font-size: 0.9em; margin-bottom: 12px; }
.pulse { width: 10px; height: 10px; background: #00ff88; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 10px #00ff88; animation: pulse 2s infinite; }
.summary { font-size: 0.85em; line-height: 1.6; color: #a0aec0; height: 4.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
@keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        body { max-width: 900px; margin: 0 auto; }
        article { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--border); }
        h3 { color: var(--neon-blue); border-left: 4px solid var(--neon-blue); padding-left: 15px; margin-top: 30px; }
        p, li { color: #d1d5db; }
        .back { margin-bottom: 20px; display: inline-block; color: var(--neon-blue); text-decoration: none; }
    </style>
</head>
<body>

    <article>
